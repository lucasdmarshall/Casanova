[project]
name = "hirara"
version = "0.1.0"
description = "Python client for the Hirara self-hosted agent tool hub — call web/PDF/OCR/code/Office tools like functions"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lucas D Marshall (Kaung Myat San)" }]
keywords = ["llm", "agent", "mcp", "tool-hub", "client", "sdk", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/lucasdmarshall/Hirara"
Repository = "https://github.com/lucasdmarshall/Hirara"
Issues = "https://github.com/lucasdmarshall/Hirara/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
