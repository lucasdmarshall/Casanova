# HiraraSTT — free open-source Whisper STT for agents (HTTP + MCP).
#
# CPU default. For GPU, swap the image/runtime once the host has NVIDIA
# Container Toolkit and set TN_DEVICE=cuda TN_COMPUTE_TYPE=float16.
#
# Bound to loopback: put your own auth in front before exposing this.
#
# The model downloads automatically on first `docker compose up` — the
# container awaits the download before it reports healthy, and the weights
# land in the `models` volume, so it happens once and survives rebuilds.
# To pre-download (or verify) without starting the service:
#
#   docker compose run --rm hirarastt python -m hirarastt.prefetch

name: hirarastt

services:
  hirarastt:
    build:
      # Context is the repo root so the build can reach the shared
      # hirara-core package (a sibling of this tool's directory).
      context: ..
      dockerfile: hirarastt/Dockerfile
    restart: unless-stopped
    environment:
      - TN_MODEL=${TN_MODEL:-base}
      - TN_DEVICE=${TN_DEVICE:-cpu}
      - TN_COMPUTE_TYPE=${TN_COMPUTE_TYPE:-int8}
      - TN_DOWNLOAD_ROOT=/data/models
      - TN_MAX_BYTES=${TN_MAX_BYTES:-26214400}
      - TN_VAD_FILTER=true
      # audio_url now fetches through hirara-core's SSRF guard (resolve-then-
      # pin, redirect re-validation, streamed byte cap), so this is safe to
      # enable on a trusted network. Still off by default — opt in per host.
      - TN_ALLOW_URL_FETCH=${TN_ALLOW_URL_FETCH:-false}
      # Local-file transcription. Fine for this loopback-bound service; set
      # false if you ever expose the port to a network.
      - TN_ALLOW_LOCAL_PATH=${TN_ALLOW_LOCAL_PATH:-true}
    volumes:
      - models:/data/models
      - tmp:/data/tmp
    ports:
      - "127.0.0.1:${TN_PORT:-8100}:8100"
    networks:
      - internal
    # The container serves only after the model is loaded (the lifespan awaits
    # it), so /health passing is a real "model ready" signal. start_period is
    # generous because a first-ever download of a large model on CPU can take
    # a few minutes; the check does not count as failing during that window.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  models:
  tmp:
