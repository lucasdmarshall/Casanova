# SearXNG overrides. Merged on top of the image's defaults.
#
# Before first run, replace secret_key:
#   openssl rand -hex 32
use_default_settings: true

general:
  instance_name: "web-tools"
  # No public-facing UI links; this instance exists to serve one API client.
  contact_url: false
  enable_metrics: false

server:
  secret_key: "CHANGE_ME_openssl_rand_hex_32"

  # The limiter exists to stop strangers abusing a public instance. This one
  # is not published to the internet — it is reachable only from the
  # web-tools container on the compose network — and the limiter blocks
  # API-shaped requests, so it is off deliberately.
  #
  # If you ever publish this port, turn the limiter back on.
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  # `json` is NOT in the image defaults. Without this line the adapter gets
  # HTML back and every search fails.
  formats:
    - html
    - json

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  # Google and Bing are left enabled but are expected to fail from a
  # datacenter IP. web_tools.config.SearchConfig does not request them by
  # default; re-add them via WT_SEARCH_ENGINES if your host gets away with it.
  - name: wikidata
    disabled: false
  - name: mojeek
    disabled: false
